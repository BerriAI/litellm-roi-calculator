services:
  roi:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - roi-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  roi-data:
